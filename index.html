<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시험기간 스터디 장소 비교 지도</title>
  
  <!-- 카카오맵 JavaScript SDK 로드 (서비스 라이브러리 포함) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ed4e152d6a3fc5bc420267cb0aba6489&libraries=services"></script>

  <style>
    /* 기본 스타일 초기화 및 레이아웃 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #333;
    }

    /* 상단 헤더 스타일 */
    header {
      background-color: #2c3e50;
      color: #ffffff;
      padding: 15px 20px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 10;
    }

    header h1 {
      font-size: 1.5rem;
    }

    /* 메인 콘텐츠 영역 (좌우 2분할) */
    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* 왼쪽 사이드바 영역 */
    .sidebar {
      width: 380px;
      background-color: #f8f9fa;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    /* 탭 버튼 스타일 */
    .tab-group {
      display: flex;
      background-color: #e9ecef;
      border-bottom: 1px solid #ccc;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 5px;
      border: none;
      background-color: transparent;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      color: #495057;
    }

    .tab-btn:hover {
      background-color: #dee2e6;
    }

    /* 활성화된 탭 디자인 */
    .tab-btn.active[data-type="cafe"] {
      background-color: #28a745;
      color: white;
    }

    .tab-btn.active[data-type="studycafe"] {
      background-color: #17a2b8;
      color: white;
    }

    .tab-btn.active[data-type="library"] {
      background-color: #007bff;
      color: white;
    }

    /* 장소 리스트 영역 */
    .place-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 10px;
    }

    .place-item {
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: box-shadow 0.2s;
    }

    .place-item:hover {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-color: #bbb;
    }

    .place-item h3 {
      font-size: 1.05rem;
      color: #333;
      margin-bottom: 5px;
    }

    .place-item p {
      font-size: 0.85rem;
      color: #666;
      margin-top: 3px;
    }

    /* 오른쪽 지도 영역 */
    .map-container {
      flex: 1;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 지도 인포윈도우(팝업) 스타일 */
    .info-popup {
      padding: 10px;
      font-size: 12px;
      line-height: 1.5;
      min-width: 200px;
    }

    .info-popup strong {
      display: block;
      font-size: 14px;
      color: #222;
      margin-bottom: 4px;
    }

    /* 반응형 레이아웃 (모바일 대응) */
    @media (max-width: 768px) {
      .container {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        height: 40%;
      }
      .map-container {
        height: 60%;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 제목 -->
  <header>
    <h1>시험기간 스터디 장소 비교 지도</h1>
  </header>

  <!-- 메인 콘테이너 -->
  <div class="container">
    <!-- 왼쪽 사이드바 -->
    <div class="sidebar">
      <div class="tab-group">
        <button class="tab-btn active" data-type="cafe" onclick="changeTab('cafe')">카페</button>
        <button class="tab-btn" data-type="studycafe" onclick="changeTab('studycafe')">스터디카페</button>
        <button class="tab-btn" data-type="library" onclick="changeTab('library')">도서관</button>
      </div>
      <ul id="placeList" class="place-list">
        <!-- 검색 결과가 여기에 dynamic하게 들어갑니다 -->
      </ul>
    </div>

    <!-- 오른쪽 지도 영역 -->
    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script>
    // 전역 변수 선언
    let map;
    let ps;
    let currentMarker;
    let markers = [];
    let activeInfoWindow = null;

    // 기본 위치 (사용자 GPS 수신 실패 시 기본값: 서울시청)
    let userLatitude = 37.5665;
    let userLongitude = 126.9780;

    // 카테고리별 마커 색상 커스텀 이미지 (SVG Data URL 생성)
    function createMarkerIcon(color) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="40" viewBox="0 0 28 40">
        <path fill="${color}" stroke="#FFFFFF" stroke-width="2" d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 26 14 26s14-15.5 14-26c0-7.73-6.27-14-14-14z"/>
        <circle cx="14" cy="14" r="5" fill="#FFFFFF"/>
      </svg>`;
      const encodedSvg = encodeURIComponent(svg);
      const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodedSvg;
      
      return new kakao.maps.MarkerImage(
        iconUrl,
        new kakao.maps.Size(28, 40),
        { offset: new kakao.maps.Point(14, 40) }
      );
    }

    // 마커 아이콘 색상 설정
    const markerIcons = {
      cafe: createMarkerIcon('#28a745'),      // 초록색
      studycafe: createMarkerIcon('#17a2b8'), // 하늘색
      library: createMarkerIcon('#007bff')    // 파란색
    };

    // 현재 선택된 탭 정보
    let currentCategory = 'cafe';

    // 페이지 로드 시 초기화 함수 실행
    window.onload = function() {
      initMap();
    };

    // 카카오지도 및 위치 초기화
    function initMap() {
      const mapContainer = document.getElementById('map');
      const mapOptions = {
        center: new kakao.maps.LatLng(userLatitude, userLongitude),
        level: 5 // 지도 확대 레벨 5
      };

      // 지도 객체 생성
      map = new kakao.maps.Map(mapContainer, mapOptions);

      // 장소 검색 객체 생성
      ps = new kakao.maps.services.Places();

      // 사용자 현재 위치 파악 (Geolocation API)
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          function(position) {
            userLatitude = position.coords.latitude;
            userLongitude = position.coords.longitude;
            const currentPosition = new kakao.maps.LatLng(userLatitude, userLongitude);

            // 지도 중심을 사용자 현재 위치로 이동
            map.setCenter(currentPosition);

            // 사용자 현재 위치 마커 추가 (빨간 핀)
            const myLocationIcon = createMarkerIcon('#dc3545');
            currentMarker = new kakao.maps.Marker({
              position: currentPosition,
              image: myLocationIcon,
              map: map
            });

            // 현재 선택된 탭으로 장소 검색 시작
            searchPlaces(currentCategory);
          },
          function(error) {
            console.warn('위치 정보를 가져올 수 없습니다. 기본 위치로 검색합니다.');
            searchPlaces(currentCategory);
          }
        );
      } else {
        searchPlaces(currentCategory);
      }
    }

    // 탭 변경 함수
    function changeTab(category) {
      currentCategory = category;

      // 탭 버튼 active 클래스 처리
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => {
        if (btn.getAttribute('data-type') === category) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // 장소 검색 재실행
      searchPlaces(category);
    }

    // 장소 검색 함수
    function searchPlaces(category) {
      // 기존 마커 및 팝업 닫기
      removeMarkers();
      if (activeInfoWindow) {
        activeInfoWindow.close();
      }

      // 검색 옵션 설정 (현재 위치 중심, 반경 5000m = 5km)
      const searchOptions = {
        location: new kakao.maps.LatLng(userLatitude, userLongitude),
        radius: 5000
      };

      // 카테고리별 검색 분기 처리
      if (category === 'cafe') {
        // CE7: 카페 카테고리 코드
        ps.categorySearch('CE7', placesSearchCallback, searchOptions);
      } else if (category === 'studycafe') {
        ps.keywordSearch('스터디카페', placesSearchCallback, searchOptions);
      } else if (category === 'library') {
        ps.keywordSearch('도서관', placesSearchCallback, searchOptions);
      }
    }

    // 카카오 장소 검색 결과 콜백 함수
    function placesSearchCallback(data, status, pagination) {
      if (status === kakao.maps.services.Status.OK) {
        displayPlaces(data);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('주변 5km 이내에 해당하는 장소가 없습니다.');
        document.getElementById('placeList').innerHTML = '';
      } else if (status === kakao.maps.services.Status.ERROR) {
        alert('검색 중 오류가 발생했습니다.');
      }
    }

    // 장소 목록 및 마커 표시 함수
    function displayPlaces(places) {
      const listContainer = document.getElementById('placeList');
      listContainer.innerHTML = ''; // 기존 목록 초기화

      const bounds = new kakao.maps.LatLngBounds();

      places.forEach((place, index) => {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);

        // 1. 지도에 마커 생성
        const marker = new kakao.maps.Marker({
          position: placePosition,
          image: markerIcons[currentCategory],
          map: map
        });

        markers.push(marker);
        bounds.extend(placePosition);

        // 2. 마커 클릭 시 나타날 팝업(인포윈도우) 내용
        const address = place.road_address_name || place.address_name || '주소 정보 없음';
        const phone = place.phone || '전화번호 정보 없음';

        const content = `
          <div class="info-popup">
            <strong>${place.place_name}</strong>
            <div>📍 ${address}</div>
            <div>📞 ${phone}</div>
          </div>
        `;

        const infoWindow = new kakao.maps.InfoWindow({
          content: content,
          removable: true
        });

        // 마커 클릭 이벤트
        kakao.maps.event.addListener(marker, 'click', function() {
          if (activeInfoWindow) {
            activeInfoWindow.close();
          }
          infoWindow.open(map, marker);
          activeInfoWindow = infoWindow;
        });

        // 3. 왼쪽 리스트 아이템 생성
        const listItem = document.createElement('li');
        listItem.className = 'place-item';
        listItem.innerHTML = `
          <h3>${place.place_name}</h3>
          <p>📍 ${address}</p>
          <p>📞 ${phone}</p>
        `;

        // 리스트 클릭 이벤트 (해당 마커로 지도 이동 및 팝업 표시)
        listItem.addEventListener('click', function() {
          map.panTo(placePosition);
          if (activeInfoWindow) {
            activeInfoWindow.close();
          }
          infoWindow.open(map, marker);
          activeInfoWindow = infoWindow;
        });

        listContainer.appendChild(listItem);
      });
    }

    // 기존 검색 마커 제거 함수
    function removeMarkers() {
      for (let i = 0; i < markers.length; i++) {
        markers[i].setMap(null);
      }
      markers = [];
    }
  </script>
</body>
</html>
