<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시험기간 스터디 장소 비교 지도</title>
  
  <!-- 카카오맵 JavaScript SDK 로드 (서비스 라이브러리 포함) -->
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=ed4e152d6a3fc5bc420267cb0aba6489&libraries=services"></script>

  <style>
    /* 기본 스타일 초기화 및 레이아웃 설정 */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      color: #333;
    }

    /* 상단 헤더 스타일 */
    header {
      background-color: #2c3e50;
      color: #ffffff;
      padding: 15px 20px;
      text-align: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      z-index: 10;
    }

    header h1 {
      font-size: 1.5rem;
    }

    /* 메인 콘텐츠 영역 (좌우 2분할) */
    .container {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* 왼쪽 사이드바 영역 */
    .sidebar {
      width: 380px;
      background-color: #f8f9fa;
      border-right: 1px solid #ddd;
      display: flex;
      flex-direction: column;
      z-index: 5;
    }

    /* 탭 버튼 스타일 */
    .tab-group {
      display: flex;
      background-color: #e9ecef;
      border-bottom: 1px solid #ccc;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 5px;
      border: none;
      background-color: transparent;
      cursor: pointer;
      font-weight: bold;
      font-size: 0.95rem;
      transition: all 0.2s ease;
      color: #495057;
    }

    .tab-btn:hover {
      background-color: #dee2e6;
    }

    /* 활성화된 탭 디자인 */
    .tab-btn.active[data-type="cafe"] {
      background-color: #28a745;
      color: white;
    }

    .tab-btn.active[data-type="studycafe"] {
      background-color: #17a2b8;
      color: white;
    }

    .tab-btn.active[data-type="library"] {
      background-color: #007bff;
      color: white;
    }

    /* 위치 상태 표시 바 및 위치 재설정 버튼 */
    .location-status {
      padding: 10px 15px;
      background-color: #e7f5ff;
      border-bottom: 1px solid #d0ebff;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .location-status span {
      color: #1864ab;
      font-weight: 500;
    }

    .relocate-btn {
      padding: 4px 8px;
      background-color: #1c7ed6;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .relocate-btn:hover {
      background-color: #1971c2;
    }

    /* 장소 리스트 영역 */
    .place-list {
      flex: 1;
      overflow-y: auto;
      list-style: none;
      padding: 10px;
    }

    .place-item {
      background-color: #ffffff;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      transition: box-shadow 0.2s;
    }

    .place-item:hover {
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-color: #bbb;
    }

    .place-item h3 {
      font-size: 1.05rem;
      color: #333;
      margin-bottom: 5px;
    }

    .place-item p {
      font-size: 0.85rem;
      color: #666;
      margin-top: 3px;
    }

    /* 오른쪽 지도 영역 */
    .map-container {
      flex: 1;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    /* 지도 인포윈도우(팝업) 스타일 */
    .info-popup {
      padding: 10px;
      font-size: 12px;
      line-height: 1.5;
      min-width: 200px;
    }

    .info-popup strong {
      display: block;
      font-size: 14px;
      color: #222;
      margin-bottom: 4px;
    }

    /* 반응형 레이아웃 (모바일 대응) */
    @media (max-width: 768px) {
      .container {
        flex-direction: column-reverse;
      }
      .sidebar {
        width: 100%;
        height: 40%;
      }
      .map-container {
        height: 60%;
      }
    }
  </style>
</head>
<body>

  <!-- 상단 제목 -->
  <header>
    <h1>시험기간 스터디 장소 비교 지도</h1>
  </header>

  <!-- 메인 컨테이너 -->
  <div class="container">
    <!-- 왼쪽 사이드바 -->
    <div class="sidebar">
      <!-- 탭 버튼 영역 -->
      <div class="tab-group">
        <button class="tab-btn active" data-type="cafe" onclick="changeTab('cafe')">카페</button>
        <button class="tab-btn" data-type="studycafe" onclick="changeTab('studycafe')">스터디카페</button>
        <button class="tab-btn" data-type="library" onclick="changeTab('library')">도서관</button>
      </div>

      <!-- 위치 정보 상태 안내 영역 -->
      <div class="location-status">
        <span id="statusText">📍 내 위치를 찾는 중...</span>
        <button class="relocate-btn" onclick="getUserLocation()">내 위치 다시잡기</button>
      </div>

      <!-- 장소 결과 리스트 -->
      <ul id="placeList" class="place-list">
        <!-- 검색 결과가 동적으로 추가됩니다 -->
      </ul>
    </div>

    <!-- 오른쪽 지도 영역 -->
    <div class="map-container">
      <div id="map"></div>
    </div>
  </div>

  <script>
    // 전역 변수 선언
    let map;
    let ps;
    let userMarker = null;
    let markers = [];
    let activeInfoWindow = null;

    // 기본 위치 (위치 권한 거부/실패 시 예비용 기본값: 서울시청)
    let userLatitude = 37.5665;
    let userLongitude = 126.9780;

    // 현재 선택된 탭 카테고리
    let currentCategory = 'cafe';

    // 카테고리별 마커 아이콘 SVG 생성 함수
    function createMarkerIcon(color) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="40" viewBox="0 0 28 40">
        <path fill="${color}" stroke="#FFFFFF" stroke-width="2" d="M14 0C6.27 0 0 6.27 0 14c0 10.5 14 26 14 26s14-15.5 14-26c0-7.73-6.27-14-14-14z"/>
        <circle cx="14" cy="14" r="5" fill="#FFFFFF"/>
      </svg>`;
      const encodedSvg = encodeURIComponent(svg);
      const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodedSvg;
      
      return new kakao.maps.MarkerImage(
        iconUrl,
        new kakao.maps.Size(28, 40),
        { offset: new kakao.maps.Point(14, 40) }
      );
    }

    // 카테고리별 마커 아이콘 생성
    const markerIcons = {
      cafe: createMarkerIcon('#28a745'),      // 초록색
      studycafe: createMarkerIcon('#17a2b8'), // 하늘색
      library: createMarkerIcon('#007bff')    // 파란색
    };

    // 웹 페이지 로드 완료 후 실행
    window.onload = function() {
      initMap();
    };

    // 카카오 지도 초기화
    function initMap() {
      const mapContainer = document.getElementById('map');
      const mapOptions = {
        center: new kakao.maps.LatLng(userLatitude, userLongitude),
        level: 5 // 지도 확대 레벨 5
      };

      // 지도 생성
      map = new kakao.maps.Map(mapContainer, mapOptions);

      // 장소 검색 서비스 객체 생성
      ps = new kakao.maps.services.Places();

      // 사용자 내 위치 탐색 시작
      getUserLocation();
    }

    // 사용자 내 위치 가져오기 (HTML5 Geolocation API)
    function getUserLocation() {
      const statusText = document.getElementById('statusText');
      statusText.innerText = '📍 내 위치를 찾는 중...';

      if (navigator.geolocation) {
        // Geolocation 옵션 설정 (정확도 우선, 타임아웃 10초)
        const geoOptions = {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 0
        };

        navigator.geolocation.getCurrentPosition(
          // 1. 위치 수신 성공 시
          function(position) {
            userLatitude = position.coords.latitude;
            userLongitude = position.coords.longitude;
            const currentPosition = new kakao.maps.LatLng(userLatitude, userLongitude);

            // 지도 중심을 내 위치로 이동
            map.setCenter(currentPosition);

            // 내 위치에 빨간색 전용 마커 표시 (기존 내 위치 마커가 있다면 제거 후 다시 생성)
            if (userMarker) {
              userMarker.setMap(null);
            }
            const myLocationIcon = createMarkerIcon('#dc3545'); // 빨간색 마커
            userMarker = new kakao.maps.Marker({
              position: currentPosition,
              image: myLocationIcon,
              map: map,
              title: '내 위치'
            });

            statusText.innerText = '📍 내 위치 파악 완료';

            // 위치를 구했으니 주변 5km 장소 검색 실행
            searchPlaces(currentCategory);
          },
          // 2. 위치 수신 실패 시 (권한 거부, 타임아웃, 로컬 파일 실행 등)
          function(error) {
            console.warn('Geolocation 에러 코드:', error.code, error.message);
            statusText.innerText = '⚠️ 내 위치 정보를 가져오지 못했습니다.';
            alert('위치 권한이 거부되었거나 지원되지 않는 환경입니다.\nVS Code Live Server 등을 이용해 접속해주세요.');
            
            // 기본 위치(서울시청) 기준 검색 실행
            searchPlaces(currentCategory);
          },
          geoOptions
        );
      } else {
        statusText.innerText = '⚠️ 브라우저가 위치 정보를 지원하지 않습니다.';
        searchPlaces(currentCategory);
      }
    }

    // 탭 클릭 변경 처리
    function changeTab(category) {
      currentCategory = category;

      // 버튼 디자인 변경
      const buttons = document.querySelectorAll('.tab-btn');
      buttons.forEach(btn => {
        if (btn.getAttribute('data-type') === category) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      // 선택한 카테고리로 검색
      searchPlaces(category);
    }

    // 주변 장소 검색 함수 (내 위치 중심 반경 5km)
    function searchPlaces(category) {
      // 이전 마커 및 인포윈도우 제거
      removeMarkers();
      if (activeInfoWindow) {
        activeInfoWindow.close();
      }

      // 검색 옵션 (내 위치 기준 반경 5000m)
      const searchOptions = {
        location: new kakao.maps.LatLng(userLatitude, userLongitude),
        radius: 5000
      };

      // 탭 카테고리별 검색 구분
      if (category === 'cafe') {
        // CE7: 카카오맵 카페 카테고리 대표 코드
        ps.categorySearch('CE7', placesSearchCallback, searchOptions);
      } else if (category === 'studycafe') {
        ps.keywordSearch('스터디카페', placesSearchCallback, searchOptions);
      } else if (category === 'library') {
        ps.keywordSearch('도서관', placesSearchCallback, searchOptions);
      }
    }

    // 카카오 검색 결과 콜백 함수
    function placesSearchCallback(data, status, pagination) {
      if (status === kakao.maps.services.Status.OK) {
        displayPlaces(data);
      } else if (status === kakao.maps.services.Status.ZERO_RESULT) {
        alert('주변 5km 이내에 해당 장소가 없습니다.');
        document.getElementById('placeList').innerHTML = '<li style="padding:15px; text-align:center; color:#888;">주변 5km 이내 검색 결과가 없습니다.</li>';
      } else if (status === kakao.maps.services.Status.ERROR) {
        alert('장소 검색 중 오류가 발생했습니다.');
      }
    }

    // 화면(지도 및 리스트)에 결과 출력
    function displayPlaces(places) {
      const listContainer = document.getElementById('placeList');
      listContainer.innerHTML = '';

      places.forEach((place) => {
        const placePosition = new kakao.maps.LatLng(place.y, place.x);

        // 1. 지도 마커 생성 및 표시
        const marker = new kakao.maps.Marker({
          position: placePosition,
          image: markerIcons[currentCategory],
          map: map
        });

        markers.push(marker);

        // 2. 마커 팝업(인포윈도우) 정보 준비
        const address = place.road_address_name || place.address_name || '주소 정보 없음';
        const phone = place.phone || '전화번호 정보 없음';

        const content = `
          <div class="info-popup">
            <strong>${place.place_name}</strong>
            <div>📍 ${address}</div>
            <div>📞 ${phone}</div>
          </div>
        `;

        const infoWindow = new kakao.maps.InfoWindow({
          content: content,
          removable: true
        });

        // 마커 클릭 시 팝업 열기
        kakao.maps.event.addListener(marker, 'click', function() {
          if (activeInfoWindow) {
            activeInfoWindow.close();
          }
          infoWindow.open(map, marker);
          activeInfoWindow = infoWindow;
        });

        // 3. 왼쪽 결과 리스트 생성
        const listItem = document.createElement('li');
        listItem.className = 'place-item';
        listItem.innerHTML = `
          <h3>${place.place_name}</h3>
          <p>📍 ${address}</p>
          <p>📞 ${phone}</p>
        `;

        // 리스트 클릭 시 지도 해당 위치로 이동 및 팝업 표시
        listItem.addEventListener('click', function() {
          map.panTo(placePosition);
          if (activeInfoWindow) {
            activeInfoWindow.close();
          }
          infoWindow.open(map, marker);
          activeInfoWindow = infoWindow;
        });

        listContainer.appendChild(listItem);
      });
    }

    // 마커 초기화 함수
    function removeMarkers() {
      for (let i = 0; i < markers.length; i++) {
        markers[i].setMap(null);
      }
      markers = [];
    }
  </script>
</body>
</html>
